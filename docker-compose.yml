services:
  order-service:
    build: .
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the service name below.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/${POSTGRES_DB}?sslmode=disable
      PAYMENT_SERVICE_URL: http://payment-service:8086
      PROMO_SERVICE_URL: http://promo-service:8092
      STOCK_SERVICE_URL: http://stock-service:8083
      MENU_SERVICE_URL: http://menu-service:8085
      FRANCHISE_SERVICE_URL: http://franchise-service:8089
      # Secret partagé pour les appels internes (Stock, Menu) — jamais loggé
      SERVICE_API_KEY: ${SERVICE_API_KEY:?SERVICE_API_KEY must be set (shared with Stock and Menu services)}
      # Broker du compose du Delivery-service (réseau partagé microservices-net)
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # Factures : envoyées au client une fois la commande payée. En local, elles
      # arrivent dans Mailpit (http://localhost:8025, compose du service auth).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - microservices-net

  order-db:
    image: postgres:17-alpine
    container_name: order-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432" # 5433 outside to avoid clashing with other local Postgres
    volumes:
      - order_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

# Shared external network so services can reach each other:
#   docker network create microservices-net   (once)
networks:
  microservices-net:
    external: true

volumes:
  order_data:
