openapi: 3.0.3
info:
  title: Order Service API
  description: >
    Good Food 3.0 — order lifecycle and Stripe (test mode) payments.
    All endpoints require a JWT issued by auth-service
    (Authorization: Bearer or auth_token cookie).
  version: 0.1.0
servers:
  - url: /
    description: Current host
tags:
  - name: Orders
  - name: Payments
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Review:
      type: object
      description: A verified review (left by the customer of a received order), shown without the customer's identity.
      properties:
        id: { type: string, format: uuid, description: The reviewed order }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
        ordered_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ReviewSummary:
      type: object
      properties:
        restaurant_id: { type: string, format: uuid }
        count: { type: integer }
        average: { type: number, description: One decimal }
        stars: { type: array, items: { type: integer }, description: "Reviews of 1 to 5 stars" }
    OrderItemInput:
      type: object
      required: [menu_item_id, menu_item_name, quantity, unit_price_cents]
      properties:
        menu_item_id: { type: string, format: uuid }
        menu_item_name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price_cents: { type: integer, minimum: 1 }
        special_instructions: { type: string }
    CreateOrderRequest:
      type: object
      required: [restaurant_id, delivery_address, items]
      properties:
        restaurant_id:
          {
            type: string,
            format: uuid,
            description: Tenant id of the restaurant,
          }
        delivery_address: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItemInput" }
        promo_code: { type: string, description: Optional network-wide promo code, validated against promo-service }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              PLACED,
              PAYMENT_PENDING,
              CONFIRMED,
              IN_PREPARATION,
              READY_FOR_PICKUP,
              IN_DELIVERY,
              DELIVERED,
              CANCELLED,
            ]
        total_amount_cents: { type: integer, description: Item subtotal, never discounted }
        discount_cents: { type: integer, description: Discount from promo_code, if any }
        amount_due_cents: { type: integer, description: What is actually charged (total_amount_cents - discount_cents) }
        promo_code: { type: string, nullable: true }
        delivery_address: { type: string }
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/OrderItemInput"
              - type: object
                properties:
                  id: { type: string, format: uuid }
        placed_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }
    PaymentIntent:
      type: object
      properties:
        intent_id: { type: string }
        client_secret: { type: string }
        amount_cents: { type: integer }
        currency: { type: string, example: eur }
    Error:
      type: object
      properties:
        error: { type: string }
        request_id: { type: string }
security:
  - bearerAuth: []
paths:
  /api/orders:
    post:
      tags: [Orders]
      summary: Place an order (role user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Order created (status PLACED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          {
            description: Validation error,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
        "403": { description: Not a customer }
        "409":
          {
            description: "Out of stock (OUT_OF_STOCK): a tracked ingredient of the restaurant is insufficient; the message names the dish and the ingredient (e.g. 'Stock insuffisant pour « Burger » : Steak (besoin 2 pièce, disponible 1)'). The order is not created.",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
        "503":
          {
            description: "Service unavailable (SERVICE_UNAVAILABLE): menu-service (recipes) or stock-service could not be reached; generic message, the cause is only logged. The order is not created.",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
    get:
      tags: [Orders]
      summary: List customer order history (own orders; admin may pass any customerId)
      parameters:
        - in: query
          name: customerId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Orders, newest first
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Order" } }
  /api/orders/ready-for-delivery:
    get:
      tags: [Orders]
      summary: Orders awaiting a courier (roles livreur/admin; polled by delivery-service)
      responses:
        "200":
          description: >-
            Claimable orders (IN_PREPARATION or READY_FOR_PICKUP), oldest
            first. Orders still being prepared are included so a courier can
            claim one and travel to the restaurant while it is cooked; the
            order only moves to IN_DELIVERY when it is actually picked up.
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/Order" } }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Order detail (owner, restaurant manager, courier or admin)
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          {
            description: Order,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Order" } },
              },
          }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /api/orders/{id}/payment-intent:
    post:
      tags: [Payments]
      summary: Create a Stripe PaymentIntent (test mode) for the order total
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "201":
          description: Intent created (idempotent while pending); order moves to PAYMENT_PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "409": { description: Order not awaiting payment }
  /api/orders/{id}/confirm:
    post:
      tags: [Payments]
      summary: Confirm the order once the payment intent succeeded
      description: In production this is triggered by a Stripe webhook; direct call in test mode.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          {
            description: Order confirmed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Order" } },
              },
          }
        "409": { description: The order was cancelled (or changed) while its payment was being confirmed }
        "502": { description: Payment not completed }
  /api/orders/{id}/review:
    post:
      tags: [Reviews]
      summary: The customer reviews their received order (once, within 30 days)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        "201": { description: Review, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "403": { description: Not the customer of this order }
        "409": { description: Not delivered yet, already reviewed, or too late }
    get:
      tags: [Reviews]
      summary: The order's review (customer, restaurant, head office)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Review, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } }
        "404": { description: Not reviewed }
  /api/reviews:
    get:
      tags: [Reviews]
      summary: A restaurant's mark and reviews, newest first (public)
      security: []
      parameters:
        - { in: query, name: restaurantId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Mark and page of reviews
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ReviewSummary" }
                  - { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Review" } } } }
  /api/reviews/summary:
    get:
      tags: [Reviews]
      summary: Marks of several restaurants (public, 100 at most); restaurants without reviews are absent
      security: []
      parameters:
        - { in: query, name: restaurantIds, required: true, schema: { type: string }, description: Comma-separated UUIDs }
      responses:
        "200": { description: Marks, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ReviewSummary" } } } } }
  /api/reviews/{id}:
    delete:
      tags: [Reviews]
      summary: Head office removes an unlawful review (moderation)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "403": { description: Head office only }
  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status (manager/admin; couriers limited to IN_DELIVERY and DELIVERED)
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, example: READY_FOR_PICKUP }
      responses:
        "200":
          {
            description: Updated order,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Order" } },
              },
          }
        "409": { description: Invalid lifecycle transition, or the order changed concurrently (retry) }
